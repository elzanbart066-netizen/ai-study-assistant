name: AI Study Assistant
on:
  push:
    paths: ["AIStudyAssistant/**", ".github/workflows/study-assistant.yml"]
  pull_request:
    paths: ["AIStudyAssistant/**", ".github/workflows/study-assistant.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AIStudyAssistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AIStudyAssistant/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
